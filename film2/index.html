<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Long String</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; }
  #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #aaa; font: 14px sans-serif; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">click to play with audio</div>
<script>
// ---------------------------------------------------------------------------
// Timeline (seconds). Shared with the renderer and the audio mixer.
// cam: [zoom, centerX, centerY] in image-normalized coords, eased from -> to.
// in: how this scene enters ('bleed' watercolor wash or 'knot' string memory).
// ---------------------------------------------------------------------------
const TIMELINE = {
  fps: 30,
  duration: 108,
  // grade: 'cool' = the grey present, 'warm' = memory. in: none | fade | cut | bleed | knot.
  scenes: [
    // ACT 1 â€” the ritual
    { img: 'v2_p01_dawn',      at: 0,     in: 'none',  dur: 0,   cam: [[1.04, 0.50, 0.50], [1.20, 0.34, 0.46]], fx: 'fluff', grade: 'cool' },
    { img: 'v2_p02_wake',      at: 6.0,   in: 'fade',  dur: 1.4, cam: [[1.22, 0.36, 0.52], [1.06, 0.50, 0.52]], fx: 'dust',  grade: 'cool' },
    { img: 'v2_p03_cups',      at: 12.0,  in: 'fade',  dur: 1.2, cam: [[1.42, 0.58, 0.32], [1.08, 0.62, 0.50]], fx: 'dust',  grade: 'cool' },
    { img: 'v2_p04_kitewall',  at: 18.5,  in: 'fade',  dur: 1.2, cam: [[1.32, 0.60, 0.42], [1.10, 0.55, 0.50]], fx: 'dust',  grade: 'cool' },
    { img: 's01_hill',         at: 23.5,  in: 'bleed', dur: 1.4, cam: [[1.34, 0.38, 0.30], [1.10, 0.56, 0.52]], fx: 'fluff', grade: 'cool' },
    // The accident
    { img: 'v2_p06_crash',     at: 30.0,  in: 'cut',   dur: 0.2, cam: [[1.16, 0.40, 0.52], [1.34, 0.32, 0.56]], fx: 'fluff', grade: 'cool' },
    // ACT 2 â€” unwinding
    { img: 'v2_p07_table',     at: 36.0,  in: 'fade',  dur: 1.8, cam: [[1.08, 0.48, 0.50], [1.34, 0.44, 0.56]], fx: 'dust',  grade: 'cool' },
    { img: 'v2_m1_grand',      at: 42.5,  in: 'knot',  dur: 1.5, cam: [[1.14, 0.48, 0.52], [1.28, 0.46, 0.50]], fx: 'gold',  grade: 'warm' },
    { img: 'v2_m2_ana',        at: 49.0,  in: 'knot',  dur: 1.6, cam: [[1.08, 0.50, 0.50], [1.30, 0.42, 0.52]], fx: 'petals', grade: 'warm' },
    { img: 's05_wedding',      at: 57.0,  in: 'knot',  dur: 1.5, cam: [[1.10, 0.42, 0.46], [1.22, 0.52, 0.52]], fx: 'petals', grade: 'warm' },
    { img: 'v2_m4_shoulders',  at: 62.5,  in: 'knot',  dur: 1.5, cam: [[1.10, 0.50, 0.55], [1.22, 0.52, 0.42]], fx: 'fluff', grade: 'warm' },
    { img: 's06_young',        at: 68.0,  in: 'knot',  dur: 1.5, cam: [[1.12, 0.50, 0.50], [1.24, 0.52, 0.58]], fx: 'gold',  grade: 'warm' },
    { img: 'v2_m6_secret',     at: 73.0,  in: 'bleed', dur: 1.0, cam: [[1.08, 0.56, 0.50], [1.42, 0.70, 0.48]], fx: 'gold',  grade: 'warm' },
    // ACT 3 â€” the reveal
    { img: 'v2_p07_table',     at: 78.0,  in: 'bleed', dur: 1.3, cam: [[1.50, 0.46, 0.74], [1.72, 0.46, 0.78]], fx: 'dust',  grade: 'cool' },
    { img: 'v2_p08_reveal',    at: 81.5,  in: 'fade',  dur: 1.6, cam: [[1.04, 0.50, 0.50], [1.34, 0.56, 0.56]], fx: 'dust' },
    { img: 'v2_p09_tear',      at: 89.0,  in: 'fade',  dur: 1.4, cam: [[1.10, 0.58, 0.42], [1.26, 0.60, 0.38]], fx: 'dust',  grade: 'cool' },
    { img: 'v2_p10_sunset',    at: 94.0,  in: 'bleed', dur: 2.0, cam: [[1.30, 0.56, 0.62], [1.10, 0.50, 0.50]], fx: 'gold' },
    { img: 'v2_p11_final',     at: 100.5, in: 'bleed', dur: 2.0, cam: [[1.16, 0.50, 0.60], [1.02, 0.50, 0.46]], fx: 'gold' },
  ],
  voice: [],
  // [asset, start, volume, fadeOutAt(optional, seconds after start)]
  sfx: [
    ['v2_sfx_cup', 14.2, 0.6], ['v2_sfx_crash', 29.75, 0.9], ['v2_sfx_tear', 80.6, 0.8], ['v2_sfx_pour', 96.0, 0.5],
  ],
  // Looping ambience beds: [asset, from, to, volume]
  amb: [
    ['v2_sfx_sea', 0, 12.5, 0.35], ['sfx_wind', 23.5, 36.5, 0.3], ['v2_sfx_night', 36.0, 42.8, 0.35],
    ['v2_sfx_night', 78.0, 94.5, 0.3], ['sfx_wind', 94.0, 108, 0.22],
  ],
  music: 'v2_music',
  subs: [],
  title: { in: -10, out: -9 },
  endTitle: { in: 104.4, fadeBlack: 103.6 },
};
window.TIMELINE = TIMELINE;

const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { // mulberry32
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Fractal value noise field, used for watercolor bleed masks.
function noiseField(w, h, seed) {
  const r = rng(seed), out = new Float32Array(w * h);
  let amp = 1, total = 0;
  for (let cell = 128; cell >= 8; cell /= 2) {
    const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2, g = new Float32Array(gw * gh).map(() => r());
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const fx = x / cell, fy = y / cell, ix = fx | 0, iy = fy | 0, tx = ease(fx - ix), ty = ease(fy - iy);
      const a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1];
      out[y * w + x] += amp * lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
    }
    total += amp; amp *= 0.55;
  }
  let mn = 1e9, mx = -1e9;
  for (let i = 0; i < out.length; i++) { out[i] /= total; mn = Math.min(mn, out[i]); mx = Math.max(mx, out[i]); }
  for (let i = 0; i < out.length; i++) out[i] = (out[i] - mn) / (mx - mn);
  return out;
}

// ---------- assets ----------
const IMGS = {};
const MW = 320, MH = 180;
let NOISE, maskSmall, maskBig, edgeSmall, edgeBig, layer, paper, grains = [], vignette;

async function setup() {
  await Promise.all(TIMELINE.scenes.map(s => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => { IMGS[s.img] = im; res(); }; im.onerror = rej; im.src = `img/${s.img}.jpg`;
  })));
  try { await document.fonts.load('italic 110px "IM Fell English"'); await document.fonts.load('80px "IM Fell English"'); } catch {}

  NOISE = TIMELINE.scenes.map((_, i) => noiseField(MW, MH, 101 + i * 7));
  maskSmall = canvas(MW, MH); maskBig = canvas(W, H);
  edgeSmall = canvas(MW, MH); edgeBig = canvas(W, H);
  layer = canvas(W, H);

  // Paper: warm fibres + blotches, multiplied over everything.
  paper = canvas(W, H);
  { const p = paper.getContext('2d'), r = rng(7);
    p.fillStyle = '#fff'; p.fillRect(0, 0, W, H);
    const n = noiseField(MW, MH, 999), id = p.createImageData(MW, MH);
    for (let i = 0; i < n.length; i++) { const v = 235 + n[i] * 20; id.data.set([v, v - 3, v - 10, 255], i * 4); }
    const s = canvas(MW, MH); s.getContext('2d').putImageData(id, 0, 0);
    p.imageSmoothingQuality = 'high'; p.drawImage(s, 0, 0, W, H);
    p.globalAlpha = 0.05; p.strokeStyle = '#6b5a43';
    for (let i = 0; i < 1400; i++) { // fibres
      const x = r() * W, y = r() * H, a = r() * Math.PI, l = 6 + r() * 26;
      p.lineWidth = 0.6 + r(); p.beginPath(); p.moveTo(x, y);
      p.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + r() * 4, y + Math.sin(a) * l * 0.5 + r() * 4, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
    }
  }
  // Film grain frames.
  for (let k = 0; k < 8; k++) {
    const g = canvas(W / 2, H / 2), gc = g.getContext('2d'), id = gc.createImageData(W / 2, H / 2), r = rng(50 + k);
    for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 90; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    gc.putImageData(id, 0, 0);
    // Dust specks and the odd hair.
    gc.fillStyle = 'rgba(40,30,20,0.8)';
    for (let d = 0; d < 6; d++) { gc.beginPath(); gc.arc(r() * W / 2, r() * H / 2, 0.5 + r() * 1.6, 0, 7); gc.fill(); }
    if (r() < 0.4) { gc.strokeStyle = 'rgba(40,30,20,0.6)'; gc.lineWidth = 0.7; gc.beginPath(); const x = r() * W / 2, y = r() * H / 2;
      gc.moveTo(x, y); gc.bezierCurveTo(x + 20, y + r() * 30, x + 30, y - 20, x + 40 + r() * 20, y + 10); gc.stroke(); }
    grains.push(g);
  }
  vignette = canvas(W, H);
  { const v = vignette.getContext('2d'), g = v.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
    g.addColorStop(0, 'rgba(60,40,20,0)'); g.addColorStop(1, 'rgba(50,32,18,0.55)'); v.fillStyle = g; v.fillRect(0, 0, W, H); }
}

// ---------- drawing ----------
function sceneWindow(i) {
  const s = TIMELINE.scenes[i], next = TIMELINE.scenes[i + 1];
  return [s.at, next ? next.at + next.dur : TIMELINE.duration];
}

function drawScene(c, i, t, frame) {
  const s = TIMELINE.scenes[i], im = IMGS[s.img], [a, b] = sceneWindow(i);
  const p = ease((t - a) / (b - a));
  const z = lerp(s.cam[0][0], s.cam[1][0], p), cx = lerp(s.cam[0][1], s.cam[1][1], p), cy = lerp(s.cam[0][2], s.cam[1][2], p);
  // Cover the frame, then zoom around (cx, cy), keeping the view inside the image.
  const base = Math.max(W / im.width, H / im.height), sc = base * z;
  const vw = W / sc, vh = H / sc;
  const sx = clamp(cx * im.width - vw / 2, 0, im.width - vw), sy = clamp(cy * im.height - vh / 2, 0, im.height - vh);
  // Stop-motion "boil": a tiny jitter that changes on threes.
  const r = rng(Math.floor(frame / 3) * 13 + i), jx = (r() - 0.5) * 2.4, jy = (r() - 0.5) * 2.4, jr = (r() - 0.5) * 0.0016;
  c.save();
  c.translate(W / 2 + jx, H / 2 + jy); c.rotate(jr); c.scale(1.004, 1.004); c.translate(-W / 2, -H / 2);
  c.imageSmoothingQuality = 'high';
  if (s.grade === 'cool') c.filter = 'saturate(0.72) brightness(0.98)';
  if (s.grade === 'warm') c.filter = 'saturate(1.12) brightness(1.03)';
  c.drawImage(im, sx, sy, vw, vh, 0, 0, W, H);
  c.filter = 'none';
  c.restore();
  // The present is cool and grey; memories glow warm, as in The House of Small Cubes.
  if (s.grade) {
    c.save(); c.globalCompositeOperation = 'soft-light';
    c.fillStyle = s.grade === 'cool' ? 'rgba(110,140,170,0.30)' : 'rgba(230,170,100,0.30)'; c.fillRect(0, 0, W, H);
    if (s.grade === 'warm') { // gentle light bloom from the top
      const g = c.createRadialGradient(W * 0.5, -H * 0.1, 0, W * 0.5, -H * 0.1, H * 1.2);
      g.addColorStop(0, 'rgba(255,225,170,0.22)'); g.addColorStop(1, 'rgba(255,225,170,0)');
      c.globalCompositeOperation = 'screen'; c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    c.restore();
  }
  drawParticles(c, s.fx, t - a, i);
}

function drawParticles(c, kind, lt, seed) {
  const r = rng(300 + seed), n = { fluff: 26, dust: 40, petals: 34, gold: 30 }[kind] || 0;
  c.save();
  for (let k = 0; k < n; k++) {
    const x0 = r() * W, y0 = r() * H, sp = 0.3 + r(), size = r(), ph = r() * 6.28;
    let x, y, a;
    if (kind === 'petals') {
      x = (x0 + lt * 70 * sp) % (W + 80) - 40; y = (y0 + lt * 45 * sp + Math.sin(lt * 1.3 + ph) * 25) % (H + 80) - 40;
      c.save(); c.translate(x, y); c.rotate(lt * 1.5 * sp + ph); c.scale(1, 0.55 + 0.4 * Math.sin(lt * 2 + ph));
      c.fillStyle = `rgba(238,190,196,${0.55 + size * 0.35})`; c.beginPath(); c.ellipse(0, 0, 7 + size * 7, 4 + size * 3, 0, 0, 7); c.fill(); c.restore();
      continue;
    }
    if (kind === 'fluff') { x = (x0 + lt * 60 * sp) % (W + 40) - 20; y = y0 + Math.sin(lt * 0.9 + ph) * 30 - lt * 6 * sp; a = 0.35 + size * 0.4; }
    else { x = x0 + Math.sin(lt * 0.4 + ph) * 40; y = (y0 - lt * 12 * sp + H * 2) % H; a = (0.2 + size * 0.5) * (0.5 + 0.5 * Math.sin(lt * 1.7 + ph)); }
    const col = kind === 'fluff' ? '255,252,240' : kind === 'gold' ? '255,226,160' : '255,245,225';
    const rad = kind === 'fluff' ? 1.5 + size * 3 : 1 + size * 2.5;
    const g = c.createRadialGradient(x, y, 0, x, y, rad * 2.2);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.fillRect(x - rad * 3, y - rad * 3, rad * 6, rad * 6);
  }
  c.restore();
}

// Watercolor wash mask: soft, noisy threshold with a darker pigment rim.
function buildMask(i, p, radial) {
  const N = NOISE[i], w = 0.16, th = lerp(-w, 1 + w, p);
  const m = maskSmall.getContext('2d'), e = edgeSmall.getContext('2d');
  const md = m.createImageData(MW, MH), ed = e.createImageData(MW, MH);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const k = y * MW + x;
    let v = N[k];
    if (radial) { const dx = (x / MW - 0.5) * 1.78, dy = y / MH - 0.5; v = 0.45 * v + 0.55 * clamp(Math.hypot(dx, dy) / 0.95); }
    const a = smooth(v - w, v + w, th);
    md.data[k * 4 + 3] = a * 255;
    const edge = Math.pow(1 - Math.abs(2 * a - 1), 3) * (a > 0.02 && a < 0.98 ? 1 : 0);
    ed.data.set([176, 132, 88, edge * 60], k * 4);
  }
  m.putImageData(md, 0, 0); e.putImageData(ed, 0, 0);
  for (const [src, dst] of [[maskSmall, maskBig], [edgeSmall, edgeBig]]) {
    const d = dst.getContext('2d'); d.clearRect(0, 0, W, H); d.imageSmoothingQuality = 'high'; d.drawImage(src, 0, 0, W, H);
  }
}

// The kite string sliding past, with a knot settling at the centre of frame.
function drawString(c, t, T0, dur) {
  const lead = 1.6, a = smooth(T0 - lead, T0 - lead + 0.5, t) * (1 - smooth(T0 + dur * 0.35, T0 + dur * 0.9, t));
  if (a <= 0) return;
  const slide = ease((t - (T0 - lead)) / lead);             // 0 -> 1 as the knot arrives
  const gap = 520, off = (1 - slide) * gap * 2.2;
  const yAt = x => H * 0.52 + Math.sin(x / 260 + T0) * 14 - Math.sin((x / W) * Math.PI) * 30;
  c.save(); c.globalAlpha = a; c.lineCap = 'round';
  c.fillStyle = 'rgba(40,28,18,0.16)'; c.fillRect(0, 0, W, H);  // gently dim the scene behind the string
  for (const [lw, col, dy] of [[8, 'rgba(255,246,228,0.35)', 0], [6, 'rgba(70,50,32,0.3)', 2], [3.6, 'rgba(62,44,28,0.92)', 0]]) {
    c.strokeStyle = col; c.lineWidth = lw; c.beginPath();
    for (let x = -20; x <= W + 20; x += 12) { const y = yAt(x) + dy; x < 0 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke();
  }
  for (let k = -3; k <= 3; k++) {
    const x = W / 2 + k * gap + off; if (x < -40 || x > W + 40) continue;
    const y = yAt(x), centre = k === 0;
    if (centre) {
      const glow = smooth(T0 - 0.5, T0 + 0.1, t);
      const g = c.createRadialGradient(x, y, 0, x, y, 140);
      g.addColorStop(0, `rgba(255,224,160,${0.55 * glow})`); g.addColorStop(1, 'rgba(255,224,160,0)');
      c.fillStyle = g; c.fillRect(x - 150, y - 150, 300, 300);
    }
    c.fillStyle = 'rgba(58,40,25,0.95)'; c.beginPath(); c.ellipse(x, y, 14, 10, 0.4, 0, 7); c.fill();
    c.strokeStyle = 'rgba(58,40,25,0.9)'; c.lineWidth = 3; c.beginPath();
    c.moveTo(x + 6, y + 6); c.quadraticCurveTo(x + 22, y + 28, x + 11, y + 38); c.moveTo(x - 4, y + 7); c.quadraticCurveTo(x - 12, y + 26, x - 3, y + 34); c.stroke();
  }
  c.restore();
}

function drawTitle(c, text, t, tin, tout, y, size, sub, ink = '60,40,26') {
  const a = smooth(tin, tin + 0.6, t) * (tout ? 1 - smooth(tout - 0.8, tout, t) : 1);
  if (a <= 0) return;
  const reveal = ease((t - tin) / 1.8);
  c.save();
  c.font = `italic ${size}px "IM Fell English", Georgia, serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width, x0 = W / 2 - tw / 2 - 20;
  // Ink reveal: a soft-edged wipe from left to right.
  const g = c.createLinearGradient(x0, 0, x0 + tw + 40, 0), edge = clamp(reveal, 0, 1);
  g.addColorStop(0, `rgba(${ink},1)`); g.addColorStop(Math.max(0, edge - 0.06), `rgba(${ink},1)`);
  g.addColorStop(Math.min(1, edge + 0.001), `rgba(${ink},0)`); g.addColorStop(1, `rgba(${ink},0)`);
  c.globalAlpha *= a; c.fillStyle = g;
  c.shadowColor = ink === '60,40,26' ? 'rgba(255,248,232,0.8)' : 'rgba(0,0,0,0)'; c.shadowBlur = 24;
  c.fillText(text, W / 2, y);
  if (sub) {
    c.shadowBlur = 16; c.font = `italic ${size * 0.34}px "IM Fell English", Georgia, serif`;
    c.globalAlpha *= smooth(tin + 1.2, tin + 2.2, t); c.fillStyle = `rgba(${ink},0.92)`;
    c.fillText(sub, W / 2, y + size * 0.72);
  }
  c.restore();
}

// Storybook subtitles: cream serif with a soft dark halo, gentle fades.
function drawSubs(c, t) {
  if (location.search.includes('nosubs')) return;
  for (const [a, b, text] of TIMELINE.subs) {
    if (t < a - 0.2 || t > b + 0.3) continue;
    const alpha = smooth(a - 0.2, a + 0.15, t) * (1 - smooth(b, b + 0.3, t));
    c.save();
    c.font = '50px "IM Fell English", Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    const y = H - 86, tw = c.measureText(text).width;
    // A soft, feathered shadow band behind the words for legibility on any scene.
    const g = c.createRadialGradient(W / 2, y - 16, 10, W / 2, y - 16, tw * 0.62 + 60);
    g.addColorStop(0, `rgba(20,12,6,${0.42 * alpha})`); g.addColorStop(1, 'rgba(20,12,6,0)');
    c.save(); c.translate(W / 2, y - 16); c.scale(1, 0.16); c.translate(-W / 2, -(y - 16));
    c.fillStyle = g; c.fillRect(W / 2 - tw, y - 16 - tw, tw * 2, tw * 2); c.restore();
    c.globalAlpha = alpha;
    c.shadowColor = 'rgba(10,6,2,0.85)'; c.shadowBlur = 10; c.shadowOffsetY = 2;
    c.fillStyle = '#fbf3e2'; c.fillText(text, W / 2, y);
    c.restore();
  }
}

function draw(t) {
  const frame = Math.round(t * TIMELINE.fps), S = TIMELINE.scenes;
  let cur = 0; for (let i = 0; i < S.length; i++) if (t >= S[i].at) cur = i;
  const s = S[cur], inTrans = s.dur > 0 && t < s.at + s.dur;

  ctx.fillStyle = '#f3ead8'; ctx.fillRect(0, 0, W, H);
  if (inTrans && (s.in === 'fade' || s.in === 'cut')) {
    // Plain dissolve (cut = a very short one, so it never pops).
    drawScene(ctx, cur - 1, t, frame);
    ctx.save(); ctx.globalAlpha = ease((t - s.at) / s.dur); drawScene(ctx, cur, t, frame); ctx.restore();
  } else if (inTrans) {
    drawScene(ctx, cur - 1, t, frame);
    const p = (t - s.at) / s.dur, L = layer.getContext('2d');
    L.globalCompositeOperation = 'source-over'; L.clearRect(0, 0, W, H);
    drawScene(L, cur, t, frame);
    buildMask(cur, p, s.in === 'knot');
    L.globalCompositeOperation = 'destination-in'; L.drawImage(maskBig, 0, 0);
    ctx.drawImage(layer, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(edgeBig, 0, 0); ctx.restore();
  } else {
    drawScene(ctx, cur, t, frame);
  }
  // The string overlay leads into each knot memory.
  for (const k of S) if (k.in === 'knot') drawString(ctx, t, k.at, k.dur);

  const T = TIMELINE.title, E = TIMELINE.endTitle;
  drawTitle(ctx, 'The Long String', t, T.in, T.out, H * 0.6, 128);

  // Finishing: paper, grade, vignette, grain, flicker.
  ctx.save();
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.45; ctx.drawImage(paper, 0, 0);
  ctx.globalAlpha = 0.6; ctx.drawImage(vignette, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.035; ctx.drawImage(grains[frame % grains.length], 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const fl = rng(frame * 31)(); ctx.globalAlpha = 0.006 + fl * 0.01; ctx.fillStyle = '#2a1a0e'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1; drawSubs(ctx, t);
  // Fade in from black / out to black.
  const blk = Math.max(1 - smooth(0, 1.6, t), smooth(E.fadeBlack, E.fadeBlack + 1.1, t));
  if (blk > 0) { ctx.globalAlpha = blk; ctx.fillStyle = '#0d0906'; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  // End card on black, in warm cream ink, fading out at the very end.
  ctx.save(); ctx.globalAlpha = 1 - smooth(TIMELINE.duration - 1.0, TIMELINE.duration - 0.1, t);
  drawTitle(ctx, 'The Long String', t, E.in, 0, H * 0.46, 92, '', '236,222,196');
  ctx.restore();
}

window.setupFilm = setup;
window.drawFilm = draw;

// ---------- live preview (not used when rendering) ----------
if (!location.search.includes('render')) {
  setup().then(() => {
    draw(3.2);
    let audio, start;
    const tick = () => { const t = audio ? audio.currentTime : (performance.now() - start) / 1000;
      if (t < TIMELINE.duration) { draw(t); requestAnimationFrame(tick); } };
    cv.onclick = () => { document.getElementById('hint').remove();
      audio = new Audio('../out/v2-mix.m4a'); audio.play().catch(() => { audio = null; }); start = performance.now(); tick(); };
  });
}
</script>
